<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CD/LP Lookup</title>
<meta name="description" content="Search the artist and album names in the music rip collection.">
<style>
  :root {
    --bg: #f7f6f2; --fg: #1d1c1a; --muted: #6b6862; --line: #dcd9d1;
    --card: #ffffff; --accent: #2a5db0; --badge: #ebe8df; --hit: #fff3b0;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --fg: #ebe9e4; --muted: #9a978f; --line: #33353a;
      --card: #1f2124; --accent: #7fa7f0; --badge: #2b2e34; --hit: #5a4a00;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 0.85rem; margin: 0 0 16px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  input[type=search] { flex: 1 1 260px; font: inherit; font-size: 1.1rem; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); }
  input[type=search]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  select { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--fg); max-width: 100%; }
  .status { color: var(--muted); font-size: 0.9rem; min-height: 1.4em; margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; }
  th { border-top: 0; font-size: 0.8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  tr.child td:first-child { padding-left: 26px; }
  .badge { display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 999px;
    background: var(--badge); color: var(--fg); white-space: nowrap; }
  .path { color: var(--muted); font-size: 0.8rem; word-break: break-all; }
  .parent { color: var(--muted); font-size: 0.8rem; }
  .year { color: var(--muted); white-space: nowrap; }
  mark { background: var(--hit); color: inherit; padding: 0 1px; border-radius: 2px; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  @media (max-width: 640px) {
    th.year, td.year, th.path, td.path { display: none; }
    .path-inline { display: block; }
  }
  @media (min-width: 641px) { .path-inline { display: none; } }
</style>
</head>
<body>
<main>
  <h1>CD/LP Lookup</h1>
  <p class="meta" id="meta">Loading index…</p>
  <form id="form" onsubmit="return false">
    <input type="search" id="q" placeholder="Search artist or album… (typos are OK)" autofocus autocomplete="off">
    <select id="genre" aria-label="Genre"><option value="">All genres</option></select>
  </form>
  <div class="status" id="status"></div>
  <div id="results"></div>
</main>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const MAX_SHOW = 300;
  let items = [];

  // ---------- normalization ----------
  const PUNCT = /[\-_.'’`;:,&/()\[\]!?"“”«»+]/g;
  function normalize(s) {
    return s.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase()
      .replace(PUNCT, ' ').replace(/\s+/g, ' ').trim();
  }
  const isCJK = (s) => /[぀-ヿ㐀-䶿一-鿿豈-﫿가-힯]/.test(s);

  // Optimal string alignment (Damerau-Levenshtein with adjacent transposition), bounded.
  function editDistance(a, b, max) {
    const la = a.length, lb = b.length;
    if (Math.abs(la - lb) > max) return max + 1;
    let prev2 = null, prev = new Array(lb + 1), cur = new Array(lb + 1);
    for (let j = 0; j <= lb; j++) prev[j] = j;
    for (let i = 1; i <= la; i++) {
      cur[0] = i;
      let rowMin = i;
      const ai = a.charCodeAt(i - 1);
      for (let j = 1; j <= lb; j++) {
        const cost = ai === b.charCodeAt(j - 1) ? 0 : 1;
        let v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
        if (i > 1 && j > 1 && ai === b.charCodeAt(j - 2) && a.charCodeAt(i - 2) === b.charCodeAt(j - 1)) {
          v = Math.min(v, prev2[j - 2] + 1);
        }
        cur[j] = v;
        if (v < rowMin) rowMin = v;
      }
      if (rowMin > max) return max + 1;
      prev2 = prev; prev = cur; cur = new Array(lb + 1);
    }
    return prev[lb];
  }

  // ---------- matching ----------
  // Returns a score for one query token against one item (0 = no match; higher is better).
  function tokenScore(tok, it) {
    if (it.words.includes(tok)) return 4;                      // exact word
    if (it.words.some((w) => w.startsWith(tok))) return 3;     // prefix
    if (it.norm.includes(tok)) return 2;                       // substring (covers CJK)
    if (tok.length >= 4 && !isCJK(tok)) {                      // fuzzy
      const max = tok.length >= 8 ? 2 : 1;
      for (const w of it.words) {
        if (w.length >= 3 && editDistance(tok, w, max) <= max) return 1;
      }
    }
    return 0;
  }

  function search(query, genre) {
    const toks = normalize(query).split(' ').filter(Boolean);
    const out = [];
    for (const it of items) {
      if (genre && it.g !== genre) continue;
      let score = 0, ok = true;
      for (const t of toks) {
        const s = tokenScore(t, it);
        if (!s) { ok = false; break; }
        score += s;
      }
      if (ok) out.push({ it, score });
    }
    out.sort((x, y) => y.score - x.score
      || (x.it.a || x.it.t).localeCompare(y.it.a || y.it.t)
      || x.it.t.localeCompare(y.it.t));
    return { total: out.length, rows: out.slice(0, MAX_SHOW).map((r) => r.it), toks };
  }

  // ---------- rendering ----------
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function highlight(text, toks) {
    if (!toks.length) return esc(text);
    let html = esc(text);
    for (const t of toks) {
      if (t.length < 2) continue;
      const rx = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      html = html.replace(rx, (m) => `\u0001${m}\u0002`);
    }
    return html.replace(/\u0001/g, '<mark>').replace(/\u0002/g, '</mark>');
  }

  function render(res) {
    const el = $('results');
    if (!res.rows.length) {
      el.innerHTML = '<div class="empty">No matches.</div>';
      return;
    }
    const rows = res.rows.map((it) => {
      const artist = it.a ? highlight(it.a, res.toks) : '<span class="parent">(compilation / various)</span>';
      const parent = it.parent ? `<div class="parent">part of: ${esc(it.parent)}</div>` : '';
      const cat = it.c ? ` <span class="badge">${esc(it.c)}</span>` : '';
      return `<tr class="${it.parent ? 'child' : ''}">
        <td><span class="badge">${esc(it.g)}</span></td>
        <td>${artist}</td>
        <td>${highlight(it.t, res.toks)}${cat}${parent}<div class="path path-inline">${esc(it.p)}</div></td>
        <td class="year">${it.y ?? ''}</td>
        <td class="path">${esc(it.p)}</td>
      </tr>`;
    }).join('');
    el.innerHTML = `<table><thead><tr><th>Genre</th><th>Artist</th><th>Album</th><th class="year">Year</th><th class="path">Folder</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  function run() {
    const q = $('q').value, g = $('genre').value;
    const t0 = performance.now();
    const res = search(q, g);
    const ms = (performance.now() - t0).toFixed(0);
    const shown = res.rows.length < res.total ? `showing first ${res.rows.length} of ` : '';
    $('status').textContent = `${shown}${res.total.toLocaleString()} match${res.total === 1 ? '' : 'es'} · ${ms} ms`;
    render(res);
    const h = new URLSearchParams();
    if (q) h.set('q', q);
    if (g) h.set('g', g);
    history.replaceState(null, '', h.toString() ? '#' + h.toString() : location.pathname);
  }

  let timer;
  function schedule() { clearTimeout(timer); timer = setTimeout(run, 120); }

  function readHash() {
    const h = new URLSearchParams(location.hash.slice(1));
    $('q').value = h.get('q') || '';
    $('genre').value = h.get('g') || '';
  }

  // Exposed for headless testing.
  window.__cdlookup = { normalize, editDistance, search, setItems: (x) => { items = x; } };

  // ---------- boot ----------
  fetch('index.json', { cache: 'no-cache' })
    .then((r) => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.json(); })
    .then((data) => {
      items = data.items.map((it) => {
        const norm = normalize([it.a, it.t, it.c || '', it.parent || '', it.y || ''].join(' '));
        return Object.assign(it, { norm, words: norm.split(' ').filter(Boolean) });
      });
      const genres = [...new Set(items.map((i) => i.g))].sort((a, b) => a.localeCompare(b));
      for (const g of genres) {
        const o = document.createElement('option');
        o.value = g; o.textContent = g;
        $('genre').appendChild(o);
      }
      const built = data.generated ? new Date(data.generated).toLocaleDateString() : 'unknown';
      $('meta').textContent = `${data.count.toLocaleString()} entries · index built ${built}`;
      readHash();
      $('q').addEventListener('input', schedule);
      $('genre').addEventListener('change', run);
      window.addEventListener('hashchange', () => { readHash(); run(); });
      run();
    })
    .catch((err) => {
      $('meta').textContent = 'Could not load index.json: ' + err.message;
    });
})();
</script>
</body>
</html>
